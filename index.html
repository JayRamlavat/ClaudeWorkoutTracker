      "d4_incdb":     { n: "Incline Bench Press",       s: 3, r: "5-8",  nt: "H4 - 3rd finger on ring - pause on chest" },

      // D6 — Pull B: Pull-ups + Side Delts + Triceps + BSS
      "d6_wpull":     { n: "Weighted Pull Ups",           c: true, ct: "pullups", s: 3, r: "3-8",   nt: "Top+Backoff - chin over bar" },

      "d6_dblatinc":  { n: "Incline BS DB Lateral Raises", s: 2, r: "10-20",  nt: "H4 - tempo - jump DB only at 20 reps" },
      "d6_seattri":   { n: "EZ Bar Skull Crushers",     s: 3, r: "8-12",  nt: "To bench edge - locked joints - RIR 2-3, reps before load" },
      "d6_cablat":    { n: "Side Delt Machine",           s: 3, r: "8-12",  nt: "H5V - slow" },
      "d6_bss":       { n: "Bulgarian Split Squat (Quad)", s: 2, r: "8-12", nt: "Front heel ELEVATED (plate) - upright torso, knee forward - start left - goblet if grip fried" },
      "d6_lowtrap":   { n: "Lower Trap Cable Raise",    s: 2, r: "10-15", nt: "Lower traps - fresh slot on squat day" },
      "d6_sapd":      { n: "Single-Arm Cable Pushdown",  s: 2, r: "10-15", nt: "Understudy for V-bar - free wrist path" },
      "d6_ohcable":   { n: "EZ Bar OH Cable Extension",  s: 3, r: "8-12",  nt: "Retired (elbow) — replaced by d6_saohext" },
      "d6_yraise":    { n: "Incline DB Y-Raises",        s: 2, r: "10-20", nt: "H4 - lower traps (unscheduled - parked for posture routine)" }
      
    };

    // Default Schedule: which exercises on which day, in order — v7.1 (2026-07-27)
    const DEFAULT_SCHEDULE = {
      1: ["bench", "d1_precurl", "d1_wdips", "d1_facepull", "d1_incurl", "d1_hangleg", "d1_rope"],
      2: ["dead", "d2_pause", "d2_seatedhamstringcurls", "d5_standcalf", "d2_legext", "d5_srdl", "d2_shrug"],
      3: ["d3_wchin", "ohp", "d3_bblat", "d3_dblat", "d6_pendrow", "d6_seattri", "d5_hamcurl"],
      4: ["d4_incdb", "d4_revpec", "d4_bracedsup", "d4_bracedham", "d1_baycurl", "d4_pecfly", "d4_abs"],
      5: ["squat", "d5_rdl", "d6_lowtrap", "d5_seatedcurl", "d2_scalf", "d2_calflp", "d5_backext", "d2_qlext"],
      6: ["d6_wpull", "d6_cablat", "d6_saohext", "d3_tbar", "d3_ezbarpd", "d6_dblatinc", "d6_bss", "d5_dbextrot"]
    };

    const WENDLER_PHASES = ['5s', '3s', '531', 'deload'];
    const PHASE_DISPLAY = { '5s': '5s Week', '3s': '3s Week', '531': '5/3/1 Week', 'deload': 'Deload' };
    const PHASE_COLORS = {
      '5s':     'bg-blue-100 text-blue-800 border-blue-200',
      '3s':     'bg-amber-100 text-amber-800 border-amber-200',
      '531':    'bg-rose-100 text-rose-800 border-rose-200',
      'deload': 'bg-emerald-100 text-emerald-800 border-emerald-200'
    };

    const wendlerPcts = {
      '5s':     [{ p: 0.65, r: '5' }, { p: 0.75, r: '5' }, { p: 0.85, r: '5+' }],
      '3s':     [{ p: 0.70, r: '3' }, { p: 0.80, r: '3' }, { p: 0.90, r: '3+' }],
      '531':    [{ p: 0.75, r: '5' }, { p: 0.85, r: '3' }, { p: 0.95, r: '1+' }],
      'deload': [{ p: 0.40, r: '5' }, { p: 0.50, r: '5' }, { p: 0.60, r: '5' }]
    };

    const dayNames = {
      1: 'Bench + Dips + Bi + Rear Delt + Abs',
      2: 'Deadlift + Ham Curl + Shrugs',
      3: 'Chins + OHP + Side Delts + Tri',
      4: 'Incline + Rear Delt + Bi + Abs',
      5: 'Squat + Low Traps + Ham Curl',
      6: 'Pull-ups + Side Delts + Tri + BSS'
    };
    const dayShort = { 1: 'Push A', 2: 'Legs A', 3: 'Pull A', 4: 'Push B', 5: 'Legs B', 6: 'Pull B' };

    const defaultSettings = {
      wendlerTM: { bench: 170, squat: 230, deadlift: 335, ohp: 95 }, // ~85% of demonstrated e1RM (reset 2026-07-27)
      calisthenics: {
        dips:    { top: 80, backoffPct: 72.5 },
        pullups: { top: 80, backoffPct: 72.5 },
        chinups: { top: 90, backoffPct: 72.5 }
      },
      wendlerPhase: '5s',    // current phase, auto-cycles
      cyclesSinceDeload: 0,  // completed 5s→3s→531 cycles since last deload
      schedule: DEFAULT_SCHEDULE,
      registry: DEFAULT_REGISTRY,
      bodyweight: 149,
      _updated: 0
    };

    // ---- 2. HELPERS ----
    const parseFirstNumber = (s) => {
      if (s == null) return null;
      const m = String(s).match(/-?\d+(\.\d+)?/);
      return m ? Number(m[0]) : null;
    };
    const isFilled = (s) => (s ?? "").toString().trim().length > 0;
    const calcBackoff = (top, pct) => Math.round((top * pct / 100) / 5) * 5;
    const calcWt = (tm, p) => Math.round(tm * p / 5) * 5;

    // Proper CSV escaping: quote fields containing commas/quotes, double inner quotes
    const csvCell = (v) => {
      const s = String(v ?? '').replace(/\r?\n/g, ' ');
      return /[",]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
    };

    // Per-session merge for workout logs: union of session keys, newer _ts wins per session.
    // Prevents whole-object last-write-wins from silently discarding a device's sessions.
    const mergeLogs = (local, cloud) => {
      if (!cloud) return local || { _updated: 0 };
      if (!local) return cloud;
      const cloudNewer = (cloud._updated || 0) > (local._updated || 0);
      const merged = { _updated: Math.max(local._updated || 0, cloud._updated || 0) };
      const keys = new Set([...Object.keys(local), ...Object.keys(cloud)]);
      keys.delete('_updated'); keys.delete('_mob');
      for (const k of keys) {
        const l = local[k], c = cloud[k];
        if (l && c) {
          const lt = l._ts || 0, ct = c._ts || 0;
          merged[k] = ct === lt ? (cloudNewer ? c : l) : (ct > lt ? c : l);
        } else merged[k] = l || c;
      }
      return merged;
    };

    const mergeData = (local, cloud) => {
      if (!cloud) return local;
      if (!local) return cloud;
      const cloudTime = cloud._updated || 0;
      const localTime = local._updated || 0;
      return cloudTime > localTime ? cloud : local;
    };

    const ensureStructure = (settings) => {
      const s = { ...settings };
      if (!s.schedule) s.schedule = DEFAULT_SCHEDULE;
      if (!s.wendlerPhase) s.wendlerPhase = '5s';
      if (s.cyclesSinceDeload == null) s.cyclesSinceDeload = 0;
      if (!s.registry) s.registry = DEFAULT_REGISTRY;
      // mobilityRegistry/mobilitySchedule keys are tolerated as inert data (module removed 2026-07-27, redo pending)
      return s;
    };

    const nextPhase = (current) => {
      const idx = WENDLER_PHASES.indexOf(current);
      // Auto-cycle: 5s -> 3s -> 531 -> 5s (skip deload, user triggers manually)
      if (current === '531') return '5s';
      if (current === 'deload') return '5s';
      return WENDLER_PHASES[(idx + 1) % WENDLER_PHASES.length];
    };

    // ---- 3. SUPABASE CLIENT ----
    const createSupabaseClient = (url, anonKey, secretKey) => {
      const baseUrl = url.replace(/\/$/, '');
      const request = async (table, method, body = null, query = '') => {
        const headers = {
          'apikey': anonKey,
          'Authorization': `Bearer ${anonKey}`,
          'Content-Type': 'application/json',
          'Prefer': method === 'POST' ? 'return=representation,resolution=merge-duplicates' : 'return=representation',
          'x-secret-key': secretKey
        };
        const options = { method, headers };
        if (body) options.body = JSON.stringify(body);
        const res = await fetch(`${baseUrl}/rest/v1/${table}${query}`, options);
        if (!res.ok) { const text = await res.text(); throw new Error(`Supabase error: ${res.status} - ${text}`); }
        return res.json();
      };
      return {
        getData: async (userId) => { const data = await request('workout_data', 'GET', null, `?user_id=eq.${userId}&select=*`); return data[0] || null; },
        upsertData: async (userId, payload) => {
          return request('workout_data', 'POST', {
            user_id: userId, secret_key: secretKey,
            settings: payload.settings, logs: payload.logs,
            completed: payload.completed, bodyweight: payload.bw,
            updated_at: new Date().toISOString()
          });
        },
        testConnection: async (userId) => { try { await request('workout_data', 'GET', null, `?user_id=eq.${userId}&select=user_id`); return { success: true }; } catch (e) { return { success: false, error: e.message }; } }
      };
    };

    // ---- 4. INPUT COMPONENTS ----
    const ExerciseInput = React.memo(({ placeholder, initialValue, lastValue, onSave, setIndex }) => {
      const [value, setValue] = useState(initialValue);
      const isEditingRef = useRef(false);
      useEffect(() => { if (!isEditingRef.current) setValue(initialValue); }, [initialValue]);

      const lastW = parseFirstNumber(lastValue);
      const currW = parseFirstNumber(value);
      const delta = (lastW != null && currW != null) ? (currW - lastW) : null;
      const showDelta = delta != null && delta !== 0;
      const deltaClass = !showDelta ? "text-stone-300" : delta > 0 ? "text-emerald-600" : "text-rose-600";

      const displayText = value || placeholder || '---';
      const charCount = Math.max(6, displayText.length + 1);
      const inputWidth = `calc(${charCount}ch + 1rem)`;

      return (
        <div className="inline-flex flex-col mb-1">
          <span className="text-[9px] text-stone-400 font-medium mb-0.5 ml-1">S{setIndex + 1}</span>
          <div className="flex items-center gap-1">
            <input type="text" placeholder={placeholder} value={value}
              onFocus={() => { isEditingRef.current = true; }}
              onChange={e => setValue(e.target.value)}
              onBlur={() => { isEditingRef.current = false; onSave(value); }}
              className="px-3 py-2.5 text-sm border-2 border-stone-200 rounded-lg bg-stone-50 text-stone-800 focus:border-stone-400 focus:bg-white transition-colors font-mono"
              style={{ width: inputWidth, minWidth: '5rem', maxWidth: '100%' }}
            />
            {isFilled(lastValue) && (
              <button type="button" onMouseDown={(e) => e.preventDefault()}
                onClick={() => { setValue(lastValue); onSave(lastValue); }}
                className="w-8 h-8 flex-shrink-0 flex items-center justify-center text-stone-400 hover:text-stone-600 active:bg-stone-200 rounded-lg border border-stone-200 bg-stone-50"
                title="Copy Last">📋</button>
            )}
          </div>
          <div className={`text-[9px] font-bold mt-0.5 ml-1 h-3 ${deltaClass}`}>
            {showDelta ? (delta > 0 ? `+${delta}` : `${delta}`) : ""}
          </div>
        </div>
      );
    });

    const NotesInput = React.memo(({ placeholder, initialValue, lastValue, onSave }) => {
      const [value, setValue] = useState(initialValue);
      const isEditingRef = useRef(false);
      const textareaRef = useRef(null);
      useEffect(() => { if (!isEditingRef.current) setValue(initialValue); }, [initialValue]);
      useEffect(() => {
        if (textareaRef.current) { textareaRef.current.style.height = 'auto'; textareaRef.current.style.height = textareaRef.current.scrollHeight + 'px'; }
      }, [value]);

      return (
        <div className="relative mt-3">
          <textarea ref={textareaRef} rows={1} placeholder={placeholder} value={value}
            onFocus={() => { isEditingRef.current = true; }}
            onChange={e => setValue(e.target.value)}
            onBlur={() => { isEditingRef.current = false; onSave(value); }}
            className="w-full px-3 py-2 text-sm border-2 border-stone-100 rounded-lg text-stone-600 resize-none overflow-hidden block min-h-[40px] leading-snug bg-transparent focus:bg-white focus:border-stone-300 transition-colors placeholder-stone-400"
            style={{ paddingRight: isFilled(lastValue) ? '2rem' : '0.5rem' }}
          />
          {isFilled(lastValue) && (
            <button type="button" onMouseDown={(e) => e.preventDefault()}
              onClick={() => { setValue(lastValue); onSave(lastValue); }}
              className="absolute right-1 top-1.5 w-6 h-6 flex items-center justify-center text-stone-400 hover:text-stone-600 active:bg-stone-100 rounded">📋</button>
          )}
        </div>
      );
    });

    // ---- 5. MAIN APP ----
    const WorkoutTracker = () => {

      // Auto-Start: find next incomplete session
      const getSmartStart = () => {
        try {
          const comp = JSON.parse(localStorage.getItem('v5-completed') || '{}');
          const maxWeek = Math.max(1, ...Object.keys(comp).map(k => parseInt(k.split('-')[0])).filter(n => !isNaN(n)));
          for (let w = 1; w <= maxWeek + 1; w++) {
            for (let d = 1; d <= 6; d++) {
              if (!comp[`${w}-${d}`]) return { w, d };
            }
          }
          return { w: maxWeek + 1, d: 1 };
        } catch (e) { return { w: 1, d: 1 }; }
      };
      const startLoc = useMemo(() => getSmartStart(), []);

      // State
      const [activeTab, setActiveTab] = useState('workout');
      const [currentWeek, setCurrentWeek] = useState(startLoc.w);
      const [activeDay, setActiveDay] = useState(startLoc.d);
      const [saveStatus, setSaveStatus] = useState('');

      // Config
      const [secretKey, setSecretKey] = useState(() => localStorage.getItem('v5-secret-key') || '');
      const [userId, setUserId] = useState(() => localStorage.getItem('v5-user-id') || 'jayV5');

      // Modals
      const [editingExercise, setEditingExercise] = useState(null);
      const [addingToDay, setAddingToDay] = useState(null);
      const [showPhaseSelector, setShowPhaseSelector] = useState(false);

      // Drag-and-drop state for schedule editor
      const [dragState, setDragState] = useState(null); // { exId, fromDay, fromIdx }
      const [dropTarget, setDropTarget] = useState(null); // { day, idx }
      const dragGhostRef = useRef(null);
      const dragScrollRef = useRef(null);

      // Supabase
      const supabaseRef = useRef(null);
      useEffect(() => {
        if (secretKey) localStorage.setItem('v5-secret-key', secretKey);
        if (userId) localStorage.setItem('v5-user-id', userId);
        if (SUPABASE_URL && SUPABASE_ANON_KEY && secretKey) {
          supabaseRef.current = createSupabaseClient(SUPABASE_URL, SUPABASE_ANON_KEY, secretKey);
        } else { supabaseRef.current = null; }
      }, [secretKey, userId]);

      const [settings, setSettings] = useState(() => {
        try { return ensureStructure(JSON.parse(localStorage.getItem('v5-settings')) || defaultSettings); }
        catch (e) { return defaultSettings; }
      });
      const [workoutLogs, setWorkoutLogs] = useState(() => {
        try { return JSON.parse(localStorage.getItem('v5-logs')) || { _updated: 0 }; } catch(e) { return { _updated: 0 }; }
      });
      const [completedSessions, setCompletedSessions] = useState(() => {
        try { return JSON.parse(localStorage.getItem('v5-completed')) || {}; } catch(e) { return {}; }
      });
      const [bodyweightLogs, setBodyweightLogs] = useState(() => {
        try { return JSON.parse(localStorage.getItem('v5-bw')) || []; } catch(e) { return []; }
      });
      const [newWeight, setNewWeight] = useState('');
      const [newDate, setNewDate] = useState(new Date().toISOString().split('T')[0]);

      // Ref for cloud sync
      const dirtyRef = useRef(false); // true when local changes haven't been pushed yet
      const stateRef = useRef({ workoutLogs, settings, completedSessions, bodyweightLogs });
      useEffect(() => { stateRef.current = { workoutLogs, settings, completedSessions, bodyweightLogs }; }, [workoutLogs, settings, completedSessions, bodyweightLogs]);

      // Cloud Logic
      useEffect(() => {
        if (!supabaseRef.current || !userId) return;
        const loadCloudData = async () => {
          try {
            setSaveStatus('Syncing... ☁️');
            const data = await supabaseRef.current.getData(userId);
            if (data) {
              if (data.settings) {
                const migrated = ensureStructure(data.settings);
                const merged = mergeData(settings, migrated);
                setSettings(merged); localStorage.setItem('v5-settings', JSON.stringify(merged));
              }
              if (data.logs) {
                const { _mob, ...cloudLogs } = data.logs; // _mob = legacy mobility logs, ignored (module removed)
                const merged = mergeLogs(workoutLogs, cloudLogs);
                setWorkoutLogs(merged); localStorage.setItem('v5-logs', JSON.stringify(merged));
              }
              if (data.completed) {
                const merged = { ...completedSessions, ...data.completed };
                setCompletedSessions(merged); localStorage.setItem('v5-completed', JSON.stringify(merged));
              }
              if (data.bodyweight) {
                const combined = [...bodyweightLogs, ...data.bodyweight];
                const unique = Array.from(new Map(combined.map(item => [item.date, item])).values()).sort((a,b) => new Date(a.date) - new Date(b.date));
                setBodyweightLogs(unique); localStorage.setItem('v5-bw', JSON.stringify(unique));
              }
            }
            setSaveStatus('Synced ✔');
            setTimeout(() => setSaveStatus(''), 2000);
          } catch (e) { console.error("Cloud load error:", e); setSaveStatus('Sync Error ❌'); setTimeout(() => setSaveStatus(''), 3000); }
        };
        loadCloudData();
      }, [secretKey, userId]);

      const pushToCloud = async () => {
        if (!supabaseRef.current || !userId) return;
        const s = stateRef.current;
        try {
          await supabaseRef.current.upsertData(userId, { settings: s.settings, logs: s.workoutLogs, completed: s.completedSessions, bw: s.bodyweightLogs });
          dirtyRef.current = false;
          setSaveStatus('Saved ✔'); setTimeout(() => setSaveStatus(''), 2000);
        } catch (e) { console.error("Cloud save error:", e); setSaveStatus('Save Error ❌'); setTimeout(() => setSaveStatus(''), 3000); }
      };

      const forcePull = async () => {
        if (!supabaseRef.current || !userId) return alert("Configure Supabase first");
        if (!confirm("OVERWRITE local data with Cloud data?")) return;
        setSaveStatus('Pulling... ⏬');
        try {
          const data = await supabaseRef.current.getData(userId);
          if (!data) throw new Error("No data found in cloud");
          ['v5-settings','v5-logs','v5-completed','v5-bw'].forEach(k => localStorage.removeItem(k));
          if(data.settings) localStorage.setItem('v5-settings', JSON.stringify(ensureStructure(data.settings)));
          if(data.logs) {
            const { _mob, ...cloudLogs } = data.logs; // legacy mobility logs stay untouched in localStorage
            localStorage.setItem('v5-logs', JSON.stringify(cloudLogs));
          }
          if(data.completed) localStorage.setItem('v5-completed', JSON.stringify(data.completed));
          if(data.bodyweight) localStorage.setItem('v5-bw', JSON.stringify(data.bodyweight));
          alert("Success! Reloading..."); window.location.reload();
        } catch (e) { alert("Failed: " + e.message); setSaveStatus('Error ❌'); }
      };

      // Auto-save every 60 seconds
      useEffect(() => {
        if (!supabaseRef.current || !userId) return;
        const id = setInterval(() => { if (!dirtyRef.current) return; setSaveStatus('Auto-Saving... ⚡'); pushToCloud(); }, 60000);
        return () => clearInterval(id);
      }, [secretKey, userId]);

      // Save helpers
      const saveTimeout = useRef(null);
      const saveSettingsDebounced = useCallback((s) => {
        const payload = { ...s, _updated: Date.now() };
        dirtyRef.current = true;
        setSettings(payload); localStorage.setItem('v5-settings', JSON.stringify(payload));
        if (saveTimeout.current) clearTimeout(saveTimeout.current);
        saveTimeout.current = setTimeout(() => pushToCloud(), 2000);
      }, [secretKey, userId]);

      const saveLogsDebounced = useCallback((l) => {
        const payload = { ...l, _updated: Date.now() };
        dirtyRef.current = true;
        setWorkoutLogs(payload); localStorage.setItem('v5-logs', JSON.stringify(payload));
        if (saveTimeout.current) clearTimeout(saveTimeout.current);
        saveTimeout.current = setTimeout(() => pushToCloud(), 2000);
      }, [secretKey, userId]);

      const saveCompletion = (c) => {
        dirtyRef.current = true;
        setCompletedSessions(c); localStorage.setItem('v5-completed', JSON.stringify(c)); pushToCloud();
      };

      const saveBW = (l) => {
        dirtyRef.current = true;
        setBodyweightLogs(l); localStorage.setItem('v5-bw', JSON.stringify(l)); pushToCloud();
      };

      // Phase management
      const setPhase = (phase) => {
        saveSettingsDebounced({ ...settings, wendlerPhase: phase });
        setShowPhaseSelector(false);
      };

      const advancePhase = () => {
        const cur = settings.wendlerPhase;
        let cycles = settings.cyclesSinceDeload || 0;
        let np;
        if (cur === '531') { cycles += 1; np = cycles >= 2 ? 'deload' : '5s'; } // deload every 2nd cycle (wks 7/14/21) — tendon history, do not override
        else if (cur === 'deload') { cycles = 0; np = '5s'; }
        else np = nextPhase(cur);
        saveSettingsDebounced({ ...settings, wendlerPhase: np, cyclesSinceDeload: cycles });
      };

      // Session management
      const handleFinishDay = () => {
        const key = `${currentWeek}-${activeDay}`;
        // Stamp today's date if the user never touched the date field (it displays a default but only saves on change)
        if (!workoutLogs[key]?._meta?.date) {
          saveSessionMeta(currentWeek, activeDay, 'date', new Date().toISOString().split('T')[0]);
        }
        saveCompletion({ ...completedSessions, [key]: true });
        let nextW = currentWeek, nextD = activeDay + 1;
        if (nextD > 6) { nextD = 1; nextW = currentWeek + 1; advancePhase(); }
        setCurrentWeek(nextW); setActiveDay(nextD);
        window.scrollTo(0,0);
      };

      const deleteDayEntry = (w, d) => {
        if (!confirm(`Clear Week ${w} Day ${d}?`)) return;
        const newLogs = { ...workoutLogs, _updated: Date.now() }; delete newLogs[`${w}-${d}`];
        saveLogsDebounced(newLogs);
        const newComp = { ...completedSessions }; delete newComp[`${w}-${d}`];
        saveCompletion(newComp);
      };

      const deleteWeekEntry = (w) => {
        if (!confirm(`Delete Week ${w}?`)) return;
        const newLogs = { ...workoutLogs, _updated: Date.now() };
        const newComp = { ...completedSessions };
        for (let d = 1; d <= 6; d++) { delete newLogs[`${w}-${d}`]; delete newComp[`${w}-${d}`]; }
        saveLogsDebounced(newLogs); saveCompletion(newComp);
      };

      // Data Access
      const logSet = (w, d, ex, i, v) => {
        const k = `${w}-${d}`; const nl = { ...workoutLogs };
        if (!nl[k]) nl[k] = {}; if (!nl[k][ex]) nl[k][ex] = { sets: [], notes: '' };
        nl[k][ex].sets[i] = v;
        nl[k][ex].n = settings.registry[ex]?.n || nl[k][ex].n; // stamp name at log time so later renames don't rewrite history
        nl[k]._ts = Date.now();
        saveLogsDebounced(nl);
      };
      const logNotes = (w, d, ex, v) => {
        const k = `${w}-${d}`; const nl = { ...workoutLogs };
        if (!nl[k]) nl[k] = {}; if (!nl[k][ex]) nl[k][ex] = { sets: [], notes: '' };
        nl[k][ex].notes = v;
        nl[k][ex].n = settings.registry[ex]?.n || nl[k][ex].n;
        nl[k]._ts = Date.now();
        saveLogsDebounced(nl);
      };
      const getLog = (w, d, ex) => workoutLogs[`${w}-${d}`]?.[ex] || { sets: [], notes: '' };

      const getSessionMeta = (w, d) => workoutLogs[`${w}-${d}`]?._meta || { date: '', duration: '' };
      const saveSessionMeta = (w, d, field, value) => {
        const k = `${w}-${d}`; const nl = { ...workoutLogs };
        if (!nl[k]) nl[k] = {}; if (!nl[k]._meta) nl[k]._meta = { date: '', duration: '' };
        nl[k]._meta[field] = value; nl[k]._ts = Date.now(); saveLogsDebounced(nl);
      };

      const jumpToSession = (w, d) => { setCurrentWeek(w); setActiveDay(d); setActiveTab('workout'); window.scrollTo(0, 0); };

      // Smart history: find most recent log for an exercise
      const getPrevLog = (w, d, exId) => {
        for (let wk = w; wk >= 1; wk--) {
          const startDay = (wk === w) ? (d - 1) : 6;
          for (let dy = startDay; dy >= 1; dy--) {
            const log = workoutLogs[`${wk}-${dy}`]?.[exId];
            if (log && (log.sets?.some(isFilled) || isFilled(log.notes))) return { ...log, _week: wk, _day: dy };
          }
        }
        return { sets: [], notes: '', _week: null };
      };

      // Schedule management: add, remove, reorder
      const removeFromSchedule = (day, exId) => {
        const newSchedule = { ...settings.schedule };
        newSchedule[day] = newSchedule[day].filter(id => id !== exId);
        saveSettingsDebounced({ ...settings, schedule: newSchedule });
      };

      const moveInSchedule = (day, exId, direction) => {
        const newSchedule = { ...settings.schedule };
        const arr = [...newSchedule[day]];
        const idx = arr.indexOf(exId);
        if (idx < 0) return;
        const target = idx + direction;
        if (target < 0 || target >= arr.length) return;
        [arr[idx], arr[target]] = [arr[target], arr[idx]];
        newSchedule[day] = arr;
        saveSettingsDebounced({ ...settings, schedule: newSchedule });
      };

      const addToSchedule = (day, exId) => {
        const newSchedule = { ...settings.schedule };
        if (!newSchedule[day]) newSchedule[day] = [];
        if (newSchedule[day].includes(exId)) return;
        newSchedule[day] = [...newSchedule[day], exId];
        saveSettingsDebounced({ ...settings, schedule: newSchedule });
      };

      // Drag-and-drop: move exercise between days or reorder within a day
      const handleDragDrop = (fromDay, fromIdx, toDay, toIdx) => {
        const newSchedule = JSON.parse(JSON.stringify(settings.schedule));
        const fromArr = newSchedule[fromDay] || [];
        const exId = fromArr[fromIdx];
        if (!exId) return;

        // Remove from source
        fromArr.splice(fromIdx, 1);
        newSchedule[fromDay] = fromArr;

        // Insert at target
        const toArr = newSchedule[toDay] || [];
        const insertIdx = Math.min(toIdx, toArr.length);
        toArr.splice(insertIdx, 0, exId);
        newSchedule[toDay] = toArr;

        saveSettingsDebounced({ ...settings, schedule: newSchedule });
      };

      // Unified drag helpers (work for both touch and mouse)
      const getPointerPos = (e) => {
        if (e.touches && e.touches[0]) return { x: e.touches[0].clientX, y: e.touches[0].clientY };
        return { x: e.clientX, y: e.clientY };
      };

      const handleDragStart = (e, exId, day, idx) => {
        // Prevent text selection on desktop
        if (e.type === 'mousedown') e.preventDefault();

        const pos = getPointerPos(e);
        const el = e.currentTarget;
        const rect = el.getBoundingClientRect();

        // Create ghost element
        const ghost = document.createElement('div');
        ghost.textContent = settings.registry[exId]?.n || exId;
        ghost.style.cssText = `position:fixed;top:${rect.top}px;left:${rect.left}px;width:${rect.width}px;padding:8px 12px;background:#1c1917;color:white;border-radius:8px;font-size:13px;font-weight:600;z-index:9999;pointer-events:none;opacity:0.92;box-shadow:0 8px 24px rgba(0,0,0,0.25);transform:scale(1.03);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;`;
        document.body.appendChild(ghost);
        dragGhostRef.current = ghost;

        setDragState({ exId, fromDay: day, fromIdx: idx, startX: pos.x, startY: pos.y, ghostOffsetX: pos.x - rect.left, ghostOffsetY: pos.y - rect.top, started: false });
      };

      const handleDragMove = useCallback((e) => {
        if (!dragState) return;
        const pos = getPointerPos(e);
        const dx = pos.x - dragState.startX;
        const dy = pos.y - dragState.startY;

        // Require minimum movement to start drag
        if (!dragState.started && Math.abs(dx) + Math.abs(dy) < 10) return;
        if (!dragState.started) {
          setDragState(prev => ({ ...prev, started: true }));
        }

        if (e.cancelable) e.preventDefault();

        // Move ghost
        if (dragGhostRef.current) {
          dragGhostRef.current.style.top = (pos.y - dragState.ghostOffsetY) + 'px';
          dragGhostRef.current.style.left = (pos.x - dragState.ghostOffsetX) + 'px';
        }

        // Auto-scroll near edges
        const scrollZone = 60;
        if (pos.y < scrollZone) window.scrollBy(0, -8);
        else if (pos.y > window.innerHeight - scrollZone) window.scrollBy(0, 8);

        // Hit-test drop targets
        const els = document.elementsFromPoint(pos.x, pos.y);
        let foundTarget = null;
        for (const el of els) {
          if (el.dataset.dropDay && el.dataset.dropIdx !== undefined) {
            foundTarget = { day: parseInt(el.dataset.dropDay), idx: parseInt(el.dataset.dropIdx) };
            break;
          }
          if (el.dataset.dropDayZone) {
            const day = parseInt(el.dataset.dropDayZone);
            const dayExercises = settings.schedule[day] || [];
            foundTarget = { day, idx: dayExercises.length };
            break;
          }
        }
        setDropTarget(foundTarget);
      }, [dragState, settings.schedule]);

      const handleDragEnd = useCallback(() => {
        if (dragGhostRef.current) {
          document.body.removeChild(dragGhostRef.current);
          dragGhostRef.current = null;
        }
        if (dragState?.started && dropTarget) {
          handleDragDrop(dragState.fromDay, dragState.fromIdx, dropTarget.day, dropTarget.idx);
        }
        setDragState(null);
        setDropTarget(null);
      }, [dragState, dropTarget]);

      // Attach global listeners when dragging (touch + mouse)
      useEffect(() => {
        if (!dragState) return;
        const move = (e) => handleDragMove(e);
        const end = () => handleDragEnd();
        // Touch
        document.addEventListener('touchmove', move, { passive: false });
        document.addEventListener('touchend', end);
        document.addEventListener('touchcancel', end);
        // Mouse
        document.addEventListener('mousemove', move);
        document.addEventListener('mouseup', end);
        return () => {
          document.removeEventListener('touchmove', move);
          document.removeEventListener('touchend', end);
          document.removeEventListener('touchcancel', end);
          document.removeEventListener('mousemove', move);
          document.removeEventListener('mouseup', end);
        };
      }, [dragState, handleDragMove, handleDragEnd]);

      // CSV Export
      const exportToCSV = () => {
        const rows = [['Week','Day','Date','Duration','Exercise ID','Exercise Name','Set 1','Set 2','Set 3','Set 4','Set 5','Notes'].join(',')];
        const maxWeek = Math.max(1, ...Object.keys(workoutLogs).filter(k => k.includes('-')).map(k => parseInt(k.split('-')[0])).filter(n => !isNaN(n)));
        for (let w = 1; w <= maxWeek; w++) {
          for (let d = 1; d <= 6; d++) {
            const data = workoutLogs[`${w}-${d}`]; if (!data) continue;
            const meta = data._meta || {};
            const entries = Object.entries(data).filter(([key]) => key !== '_meta' && key !== '_ts');
            for (const [exId, exData] of entries) {
              const exName = exData.n || settings.registry[exId]?.n || exId; // stamped name wins over current registry
              const sets = exData.sets || [];
              const setPadded = []; for (let i = 0; i < 5; i++) setPadded.push(csvCell(sets[i] || ''));
              rows.push([w, d, meta.date||'', meta.duration||'', exId, csvCell(exName), ...setPadded, csvCell(exData.notes || '')].join(','));
            }
          }
        }
        if (bodyweightLogs.length) {
          rows.push(''); rows.push('Bodyweight Log'); rows.push('Date,Weight (lbs)');
          bodyweightLogs.forEach(e => rows.push(`${e.date},${e.weight}`));
        }
        const blob = new Blob([rows.join('\n')], { type: 'text/csv;charset=utf-8;' });
        const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
        a.download = `workout-v5-${new Date().toISOString().split('T')[0]}.csv`;
        document.body.appendChild(a); a.click(); document.body.removeChild(a);
      };

      // Get max week with data
      const getMaxWeek = () => {
        const keys = Object.keys(workoutLogs).filter(k => k !== '_updated' && k.includes('-'));
        if (keys.length === 0) return 1;
        return Math.max(1, ...keys.map(k => parseInt(k.split('-')[0])).filter(n => !isNaN(n)));
      };

      // Best recent e1RM (Epley) per Wendler lift, parsed from logged sets like "150x5+", "205NBx3"
      const liftExId = { bench: 'bench', squat: 'squat', deadlift: 'dead', ohp: 'ohp' };
      const recentE1RM = (lift) => {
        const exId = liftExId[lift];
        const maxW = getMaxWeek();
        let best = null;
        for (const k of Object.keys(workoutLogs)) {
          if (!k.includes('-')) continue;
          const wk = parseInt(k.split('-')[0]);
          if (isNaN(wk) || wk < maxW - 7) continue; // last ~8 weeks only
          const ex = workoutLogs[k]?.[exId];
          if (!ex || !Array.isArray(ex.sets)) continue;
          for (const s of ex.sets) {
            const m = String(s || '').match(/(\d+(?:\.\d+)?)[^x\d]*x\s*(\d+)/i);
            if (!m) continue;
            const w = parseFloat(m[1]); const r = parseInt(m[2]);
            if (w < 45 || r < 1 || r > 15) continue; // ignore warmup-ish / unparseable
            const e = w * (1 + r / 30);
            if (!best || e > best.e) best = { e, w, r, wk };
          }
        }
        return best;
      };

      // ---- MODALS ----

      // Exercise Editor
      const ExerciseEditorModal = ({ exId, onClose }) => {
        const ex = settings.registry[exId] || {};
        const [name, setName] = useState(ex.n || '');
        const [sets, setSets] = useState(ex.s || 3);
        const [reps, setReps] = useState(ex.r || '8-12');
        const [notes, setNotes] = useState(ex.nt || '');

        const handleSave = () => {
          const newRegistry = { ...settings.registry };
          newRegistry[exId] = { ...newRegistry[exId], n: name, s: parseInt(sets) || 3, r: reps, nt: notes };
          saveSettingsDebounced({ ...settings, registry: newRegistry });
          onClose();
        };

        // New movement in an old slot? Create a fresh ID so histories stay separate instead of renaming in place.
        const handleDuplicate = () => {
          if (!confirm(`Create a new variant of "${name}"?\n\nThe old ID keeps its history; a new ID starts clean and takes this slot in the schedule.`)) return;
          const base = exId.replace(/_v\d+$/, '');
          let v = 2, newId = `${base}_v${v}`;
          while (settings.registry[newId]) { v++; newId = `${base}_v${v}`; }
          const newRegistry = { ...settings.registry, [newId]: { ...settings.registry[exId], n: name, s: parseInt(sets) || 3, r: reps, nt: notes } };
          const newSchedule = JSON.parse(JSON.stringify(settings.schedule));
          for (const d in newSchedule) newSchedule[d] = newSchedule[d].map(id => id === exId ? newId : id);
          saveSettingsDebounced({ ...settings, registry: newRegistry, schedule: newSchedule });
          onClose();
        };

        return (
          <div className="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4" onClick={onClose}>
            <div className="bg-white rounded-xl shadow-xl max-w-md w-full p-5" onClick={e => e.stopPropagation()}>
              <div className="flex justify-between items-center mb-4">
                <h3 className="font-bold text-stone-800 text-lg">Edit Exercise</h3>
                <button onClick={onClose} className="text-stone-400 hover:text-stone-600 text-xl">×</button>
              </div>
              <div className="space-y-4">
                <div>
                  <label className="text-[10px] font-bold text-stone-400 uppercase tracking-wide mb-1 block">Exercise ID</label>
                  <div className="px-3 py-2 bg-stone-100 rounded-lg text-sm text-stone-500 font-mono">{exId}</div>
                </div>
                <div>
                  <label className="text-[10px] font-bold text-stone-400 uppercase tracking-wide mb-1 block">Name</label>
                  <input type="text" value={name} onChange={e => setName(e.target.value)} className="w-full px-3 py-2 border border-stone-300 rounded-lg text-sm" />
                </div>
                <div className="grid grid-cols-2 gap-3">
                  <div>
                    <label className="text-[10px] font-bold text-stone-400 uppercase tracking-wide mb-1 block">Sets</label>
                    <input type="number" value={sets} onChange={e => setSets(e.target.value)} className="w-full px-3 py-2 border border-stone-300 rounded-lg text-sm text-center" />
                  </div>
                  <div>
                    <label className="text-[10px] font-bold text-stone-400 uppercase tracking-wide mb-1 block">Rep Range</label>
                    <input type="text" value={reps} onChange={e => setReps(e.target.value)} placeholder="8-12" className="w-full px-3 py-2 border border-stone-300 rounded-lg text-sm text-center" />
                  </div>
                </div>
                <div>
                  <label className="text-[10px] font-bold text-stone-400 uppercase tracking-wide mb-1 block">Default Note</label>
                  <input type="text" value={notes} onChange={e => setNotes(e.target.value)} placeholder="Cue or reminder" className="w-full px-3 py-2 border border-stone-300 rounded-lg text-sm" />
                </div>
                {(ex.w || ex.c) && (
                  <div className="p-3 bg-amber-50 rounded-lg border border-amber-100">
                    <p className="text-xs text-amber-700">
                      {ex.w && "⚠️ Wendler — sets/reps controlled by cycle phase"}
                      {ex.c && "⚠️ Calisthenics — load controlled in Streetlifting settings"}
                    </p>
                  </div>
                )}
              </div>
              <button onClick={handleDuplicate} className="w-full mt-4 py-2.5 text-xs font-bold text-blue-700 bg-blue-50 border border-blue-200 rounded-lg hover:bg-blue-100">🔀 New Variant — fresh ID + separate history, takes this slot</button>
              <div className="flex gap-3 mt-3">
                <button onClick={onClose} className="flex-1 py-2.5 text-sm font-bold text-stone-500 bg-stone-100 rounded-lg">Cancel</button>
                <button onClick={handleSave} className="flex-1 py-2.5 text-sm font-bold text-white bg-stone-800 rounded-lg">Save</button>
              </div>
            </div>
          </div>
        );
      };

      // Add Exercise Modal
      const AddExerciseModal = ({ day, onClose }) => {
        const [mode, setMode] = useState('existing'); // 'existing' or 'new'
        const [selectedId, setSelectedId] = useState('');
        const [newId, setNewId] = useState('');
        const [newName, setNewName] = useState('');
        const [newSets, setNewSets] = useState('3');
        const [newReps, setNewReps] = useState('8-12');
        const [newNotes, setNewNotes] = useState('');

        const currentDayIds = settings.schedule[day] || [];
        const existingIds = Object.keys(settings.registry).filter(id => !currentDayIds.includes(id)).sort((a,b) => (settings.registry[a]?.n || '').localeCompare(settings.registry[b]?.n || ''));

        const handleAdd = () => {
          if (mode === 'existing') {
            if (!selectedId) return;
            addToSchedule(day, selectedId);
          } else {
            const id = newId.trim().toLowerCase().replace(/\s+/g, '_');
            if (!id || !newName.trim()) return alert("ID and Name required");
            if (settings.registry[id]) return alert("ID already exists");
            // ATOMIC: registry + schedule in ONE save. Two sequential saves both spread the
            // same stale `settings` snapshot, so the second (schedule) clobbered the first
            // (registry) — scheduled id with no registry entry = the invisible "ghost exercise" bug.
            const newRegistry = { ...settings.registry, [id]: { n: newName.trim(), s: parseInt(newSets) || 3, r: newReps || '8-12', nt: newNotes || '' } };
            const newSchedule = { ...settings.schedule };
            if (!newSchedule[day]) newSchedule[day] = [];
            if (!newSchedule[day].includes(id)) newSchedule[day] = [...newSchedule[day], id];
            saveSettingsDebounced({ ...settings, registry: newRegistry, schedule: newSchedule });
          }
          onClose();
        };

        return (
          <div className="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4" onClick={onClose}>
            <div className="bg-white rounded-xl shadow-xl max-w-md w-full p-5 max-h-[90vh] overflow-y-auto" onClick={e => e.stopPropagation()}>
              <div className="flex justify-between items-center mb-4">
                <h3 className="font-bold text-stone-800 text-lg">Add Exercise to Day {day}</h3>
                <button onClick={onClose} className="text-stone-400 hover:text-stone-600 text-xl">×</button>
              </div>

              <div className="flex gap-2 mb-4">
                <button onClick={() => setMode('existing')} className={`flex-1 py-2 text-xs font-bold rounded-lg ${mode === 'existing' ? 'bg-stone-800 text-white' : 'bg-stone-100 text-stone-500'}`}>From Registry</button>
                <button onClick={() => setMode('new')} className={`flex-1 py-2 text-xs font-bold rounded-lg ${mode === 'new' ? 'bg-stone-800 text-white' : 'bg-stone-100 text-stone-500'}`}>Create New</button>
              </div>

              {mode === 'existing' ? (
                <div className="space-y-2 max-h-60 overflow-y-auto">
                  {existingIds.length === 0 && <p className="text-xs text-stone-400 text-center py-4">All exercises already on this day</p>}
                  {existingIds.map(id => (
                    <button key={id} onClick={() => setSelectedId(id)}
                      className={`w-full text-left px-3 py-2.5 rounded-lg text-sm transition-colors ${selectedId === id ? 'bg-stone-800 text-white' : 'bg-stone-50 text-stone-700 hover:bg-stone-100'}`}>
                      {settings.registry[id]?.n || id}
                      <span className="text-xs opacity-60 ml-2">{settings.registry[id]?.s}×{settings.registry[id]?.r}</span>
                    </button>
                  ))}
                </div>
              ) : (
                <div className="space-y-3">
                  <div>
                    <label className="text-[10px] font-bold text-stone-400 uppercase tracking-wide mb-1 block">Exercise ID (unique)</label>
                    <input type="text" value={newId} onChange={e => setNewId(e.target.value)} placeholder="d1_newexercise" className="w-full px-3 py-2 border border-stone-300 rounded-lg text-sm font-mono" />
                  </div>
                  <div>
                    <label className="text-[10px] font-bold text-stone-400 uppercase tracking-wide mb-1 block">Name</label>
                    <input type="text" value={newName} onChange={e => setNewName(e.target.value)} placeholder="Cable Rows" className="w-full px-3 py-2 border border-stone-300 rounded-lg text-sm" />
                  </div>
                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="text-[10px] font-bold text-stone-400 uppercase tracking-wide mb-1 block">Sets</label>
                      <input type="number" value={newSets} onChange={e => setNewSets(e.target.value)} className="w-full px-3 py-2 border border-stone-300 rounded-lg text-sm text-center" />
                    </div>
                    <div>
                      <label className="text-[10px] font-bold text-stone-400 uppercase tracking-wide mb-1 block">Rep Range</label>
                      <input type="text" value={newReps} onChange={e => setNewReps(e.target.value)} placeholder="8-12" className="w-full px-3 py-2 border border-stone-300 rounded-lg text-sm text-center" />
                    </div>
                  </div>
                  <div>
                    <label className="text-[10px] font-bold text-stone-400 uppercase tracking-wide mb-1 block">Note</label>
                    <input type="text" value={newNotes} onChange={e => setNewNotes(e.target.value)} placeholder="Cue or reminder" className="w-full px-3 py-2 border border-stone-300 rounded-lg text-sm" />
                  </div>
                </div>
              )}

              <div className="flex gap-3 mt-6">
                <button onClick={onClose} className="flex-1 py-2.5 text-sm font-bold text-stone-500 bg-stone-100 rounded-lg">Cancel</button>
                <button onClick={handleAdd} className="flex-1 py-2.5 text-sm font-bold text-white bg-stone-800 rounded-lg">Add</button>
              </div>
            </div>
          </div>
        );
      };

      // Phase Selector Modal
      const PhaseSelectorModal = () => (
        <div className="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4" onClick={() => setShowPhaseSelector(false)}>
          <div className="bg-white rounded-xl shadow-xl max-w-sm w-full p-5" onClick={e => e.stopPropagation()}>
            <h3 className="font-bold text-stone-800 text-lg mb-4">Set Wendler Phase</h3>
            <div className="space-y-2">
              {WENDLER_PHASES.map(phase => (
                <button key={phase} onClick={() => setPhase(phase)}
                  className={`w-full text-left px-4 py-3 rounded-lg font-bold text-sm transition-colors border-2 ${settings.wendlerPhase === phase ? PHASE_COLORS[phase] + ' border-current' : 'bg-stone-50 text-stone-600 border-stone-100 hover:bg-stone-100'}`}>
                  {PHASE_DISPLAY[phase]}
                  {settings.wendlerPhase === phase && <span className="float-right">✔</span>}
                </button>
              ))}
            </div>
            <p className="text-[10px] text-stone-400 mt-4 text-center">Phase auto-advances after completing all 6 days. Use this to override.</p>
          </div>
        </div>
      );

      // ---- TAB RENDERERS ----

      // SETUP TAB
      const renderSetupTab = () => {
        const isConnected = supabaseRef.current !== null;
        return (
          <div className="p-4 space-y-6 max-w-md mx-auto">
            {editingExercise && <ExerciseEditorModal exId={editingExercise} onClose={() => setEditingExercise(null)} />}
            {addingToDay && <AddExerciseModal day={addingToDay} onClose={() => setAddingToDay(null)} />}

            {/* Cloud Sync */}
            <div className="bg-white rounded-xl shadow-sm border border-stone-200 p-5">
              <div className="flex items-center gap-2 mb-4">
                <h2 className="font-bold text-stone-800 text-lg">Cloud Sync</h2>
                <span className="text-[10px] font-bold bg-emerald-100 text-emerald-700 px-2 py-0.5 rounded">Supabase</span>
              </div>
              <div className="space-y-3">
                <div className="p-3 bg-emerald-50 rounded-lg border border-emerald-100">
                  <p className="text-xs text-emerald-700">✔ Supabase URL & Key configured in code</p>
                </div>
                <div>
                  <label className="text-[10px] font-bold text-stone-400 uppercase tracking-wide mb-1 block">Secret Key <span className="text-rose-500">*</span></label>
                  <input type="password" placeholder="Your private secret" value={secretKey} onChange={e => setSecretKey(e.target.value.trim())}
                    className="w-full px-4 py-3 border border-stone-300 rounded-lg text-sm font-mono bg-stone-50" />
                </div>
                <div>
                  <label className="text-[10px] font-bold text-stone-400 uppercase tracking-wide mb-1 block">User ID</label>
                  <input type="text" placeholder="jayV5" value={userId} onChange={e => setUserId(e.target.value.trim())}
                    className="w-full px-4 py-3 border border-stone-300 rounded-lg text-sm font-mono bg-stone-50" />
                </div>
              </div>
              <div className="flex gap-3 mt-4 items-center">
                {isConnected ? <span className="text-xs font-bold text-emerald-600 bg-emerald-50 px-2 py-1 rounded">Connected</span> : <span className="text-xs text-stone-400">{secretKey ? 'Connecting...' : 'Enter Secret Key'}</span>}
                <button onClick={() => { localStorage.setItem('v5-secret-key', secretKey); localStorage.setItem('v5-user-id', userId); alert('Config saved! Reload to sync.'); window.location.reload(); }}
                  className="ml-auto text-xs font-bold text-stone-600 bg-stone-100 px-3 py-1.5 rounded hover:bg-stone-200">Save Config</button>
              </div>
              <div className="grid grid-cols-2 gap-3 mt-4">
                <button onClick={() => { if(!isConnected) return alert("Enter secret key first"); pushToCloud(); }}
                  className="bg-stone-800 text-stone-100 text-xs font-bold px-2 py-3 rounded-lg disabled:opacity-50" disabled={!isConnected}>Push (Local → Cloud)</button>
                <button onClick={forcePull}
                  className="bg-white border-2 border-stone-800 text-stone-900 text-xs font-bold px-2 py-3 rounded-lg disabled:opacity-50" disabled={!isConnected}>Download (Cloud → Local)</button>
              </div>
              <button onClick={() => {
                if (!confirm("Reset schedule & exercise registry to code defaults? Your workout logs and TMs will NOT be affected.")) return;
                const updated = { ...settings, schedule: JSON.parse(JSON.stringify(DEFAULT_SCHEDULE)), registry: JSON.parse(JSON.stringify(DEFAULT_REGISTRY)), _updated: Date.now() };
                setSettings(updated);
                localStorage.setItem('v5-settings', JSON.stringify(updated));
                if (supabaseRef.current && userId) {
                  const s = stateRef.current;
                  supabaseRef.current.upsertData(userId, { settings: updated, logs: s.workoutLogs, completed: s.completedSessions, bw: s.bodyweightLogs });
                }
                setSaveStatus('Defaults restored ✔'); setTimeout(() => setSaveStatus(''), 2000);
              }}
                className="w-full mt-3 bg-amber-50 border-2 border-amber-300 text-amber-800 text-xs font-bold px-2 py-3 rounded-lg hover:bg-amber-100">
                🔄 Reset Schedule &amp; Exercises to Defaults
              </button>
            </div>

            {/* Wendler TMs */}
            <div className="bg-white rounded-xl shadow-sm border border-stone-200 p-5">
              <div className="flex justify-between items-center mb-4">
                <h2 className="font-bold text-stone-800 text-lg">Wendler TMs</h2>
                <button onClick={() => setShowPhaseSelector(true)} className={`text-xs font-bold px-3 py-1.5 rounded-lg border ${PHASE_COLORS[settings.wendlerPhase]}`}>
                  {PHASE_DISPLAY[settings.wendlerPhase]}
                </button>
              </div>
              <div className="grid grid-cols-2 gap-4">
                {['bench', 'squat', 'deadlift', 'ohp'].map(l => (
                  <div key={l}>
                    <label className="text-xs font-bold text-stone-500 uppercase tracking-wide mb-1 block">{l}</label>
                    <input type="number" value={settings.wendlerTM[l]}
                      onChange={e => saveSettingsDebounced({ ...settings, wendlerTM: { ...settings.wendlerTM, [l]: parseFloat(e.target.value)||0 } })}
                      className="w-full px-3 py-2 border border-stone-300 rounded-lg bg-stone-50 font-bold" />
                  </div>
                ))}
              </div>
            </div>

            {/* Calisthenics */}
            <div className="bg-white rounded-xl shadow-sm border border-stone-200 p-5">
              <h2 className="font-bold text-stone-800 mb-4 text-lg">Streetlifting</h2>
              {['dips', 'pullups', 'chinups'].map(ex => (
                <div key={ex} className="mb-5 last:mb-0">
                  <div className="flex justify-between items-baseline mb-2">
                    <label className="text-xs font-bold text-stone-500 uppercase">{ex}</label>
                    <span className="text-[10px] text-stone-400">Backoff: {calcBackoff(settings.calisthenics[ex]?.top||0, settings.calisthenics[ex]?.backoffPct||75)} lbs</span>
                  </div>
                  <div className="grid grid-cols-2 gap-3">
                    <input type="number" placeholder="Top" value={settings.calisthenics[ex]?.top||''}
                      onChange={e => saveSettingsDebounced({...settings, calisthenics: { ...settings.calisthenics, [ex]: { ...settings.calisthenics[ex], top: parseFloat(e.target.value)||0 } }})}
                      className="w-full px-3 py-2 border border-stone-300 rounded-lg bg-stone-50 text-center font-bold" />
                    <div className="relative">
                      <input type="number" value={settings.calisthenics[ex]?.backoffPct||''}
                        onChange={e => saveSettingsDebounced({...settings, calisthenics: { ...settings.calisthenics, [ex]: { ...settings.calisthenics[ex], backoffPct: parseFloat(e.target.value)||0 } }})}
                        className="w-full px-3 py-2 pr-8 border border-stone-300 rounded-lg bg-stone-50 text-center font-bold" />
                      <span className="absolute right-3 top-1/2 -translate-y-1/2 text-stone-400 font-bold">%</span>
                    </div>
                  </div>
                </div>
              ))}
            </div>

            {/* Schedule + Registry Editor */}
            <div className="bg-white rounded-xl shadow-sm border border-stone-200 p-5">
              <h2 className="font-bold text-stone-800 text-lg mb-4">Schedule & Exercises</h2>
              <p className="text-xs text-stone-500 mb-4">Hold ≡ to drag exercises between days. Tap name to edit. ✕ to remove.</p>
              <div className="space-y-1">
                {[1,2,3,4,5,6].map(day => {
                  const dayExercises = settings.schedule[day] || [];
                  const isDragOverDay = dropTarget?.day === day;
                  return (
                  <div key={day} className="mb-4" data-drop-day-zone={day}>
                    <div className="flex justify-between items-center py-2 sticky top-0 bg-white z-10">
                      <div className="text-[10px] font-bold text-stone-400 uppercase tracking-wide">
                        Day {day} — {dayShort[day]}
                      </div>
                      <button onClick={() => setAddingToDay(day)} className="text-[10px] font-bold text-emerald-600 bg-emerald-50 px-2 py-1 rounded hover:bg-emerald-100">+ Add</button>
                    </div>
                    {dayExercises.map((exId, idx) => {
                      const ex = settings.registry[exId];
                      if (!ex) return null;
                      const isDragging = dragState?.started && dragState.exId === exId && dragState.fromDay === day;
                      const isDropHere = dropTarget?.day === day && dropTarget?.idx === idx;
                      return (
                        <React.Fragment key={exId}>
                          {isDropHere && <div className="h-1 bg-blue-400 rounded-full mx-2 my-1 transition-all"></div>}
                          <div
                            className={`flex items-center gap-1 py-1.5 group rounded-lg transition-all ${isDragging ? 'opacity-25 scale-95' : ''}`}
                            data-drop-day={day}
                            data-drop-idx={idx}
                          >
                            <div
                              className="text-stone-300 hover:text-stone-500 cursor-grab active:cursor-grabbing px-1 py-2 select-none touch-none text-sm"
                              onTouchStart={(e) => handleDragStart(e, exId, day, idx)}
                              onMouseDown={(e) => handleDragStart(e, exId, day, idx)}
                            >≡</div>
                            <div className="flex flex-col gap-0.5 mr-1">
                              <button onClick={() => moveInSchedule(day, exId, -1)} className="text-[10px] text-stone-300 hover:text-stone-600 leading-none" disabled={idx === 0}>▲</button>
                              <button onClick={() => moveInSchedule(day, exId, 1)} className="text-[10px] text-stone-300 hover:text-stone-600 leading-none" disabled={idx === dayExercises.length - 1}>▼</button>
                            </div>
                            <button onClick={() => setEditingExercise(exId)} className="flex-1 text-left text-sm text-stone-700 hover:text-stone-900 truncate">
                              {ex.n}
                              {ex.w && <span className="ml-1.5 text-[9px] font-bold px-1 py-0.5 rounded bg-blue-100 text-blue-700">W</span>}
                              {ex.c && <span className="ml-1.5 text-[9px] font-bold px-1 py-0.5 rounded bg-purple-100 text-purple-700">C</span>}
                            </button>
                            <span className="text-[10px] text-stone-400 mr-2">{ex.s}×{ex.r}</span>
                            <button onClick={() => { if(confirm(`Remove ${ex.n} from Day ${day}?`)) removeFromSchedule(day, exId); }}
                              className="text-stone-300 hover:text-rose-500 text-xs px-1">✕</button>
                          </div>
                        </React.Fragment>
                      );
                    })}
                    {/* Drop zone at end of day */}
                    {isDragOverDay && dropTarget?.idx >= dayExercises.length && (
                      <div className="h-1 bg-blue-400 rounded-full mx-2 my-1 transition-all"></div>
                    )}
                    {dayExercises.length === 0 && (
                      <div className="py-4 text-center text-xs text-stone-300 border-2 border-dashed border-stone-200 rounded-lg" data-drop-day-zone={day}>
                        Drop exercise here
                      </div>
                    )}
                  </div>
                  );
                })}
              </div>
            </div>

            {/* Export */}
            <div className="bg-white rounded-xl shadow-sm border border-stone-200 p-5">
              <h2 className="font-bold text-stone-800 mb-4 text-lg">Export & Backup</h2>
              <div className="space-y-3">
                <button onClick={exportToCSV} className="w-full bg-emerald-600 text-white py-3 rounded-lg text-sm font-bold flex items-center justify-center gap-2 hover:bg-emerald-700 transition-colors">
                  <span>📊</span> Export Logs to CSV
                </button>
                <button onClick={() => {
                  const blob = new Blob([JSON.stringify({ settings, logs: workoutLogs, bw: bodyweightLogs, completed: completedSessions }, null, 2)], { type: 'application/json' });
                  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `tracker-backup-${new Date().toISOString().split('T')[0]}.json`;
                  document.body.appendChild(a); a.click(); document.body.removeChild(a);
                }} className="w-full bg-stone-100 text-stone-700 py-3 rounded-lg text-sm font-bold flex items-center justify-center gap-2 hover:bg-stone-200 transition-colors">
                  <span>💾</span> Download Full Backup (JSON)
                </button>
                <label className="w-full bg-stone-100 text-stone-700 py-3 rounded-lg text-sm font-bold flex items-center justify-center gap-2 hover:bg-stone-200 transition-colors cursor-pointer">
                  <span>📥</span> Import Backup (JSON)
                  <input type="file" accept=".json,application/json" className="hidden" onChange={e => {
                    const file = e.target.files && e.target.files[0];
                    if (!file) return;
                    const reader = new FileReader();
                    reader.onload = (ev) => {
                      try {
                        const data = JSON.parse(ev.target.result);
                        if (!data.settings || !data.settings.registry || !data.settings.schedule) return alert("Not a valid backup: missing settings.registry / settings.schedule");
                        if (!confirm("Import backup?\n\nThis REPLACES the program (settings). Logs / bodyweight / completed are only replaced if the file actually contains them.")) return;
                        // Stamp import as newest so cloud merge doesn't resurrect the old program
                        localStorage.setItem('v5-settings', JSON.stringify(ensureStructure({ ...data.settings, _updated: Date.now() })));
                        const hasEntries = (o) => o && Object.keys(o).some(k => k !== '_updated');
                        if (hasEntries(data.logs)) localStorage.setItem('v5-logs', JSON.stringify(data.logs));
                        if (Array.isArray(data.bw) && data.bw.length) localStorage.setItem('v5-bw', JSON.stringify(data.bw));
                        if (hasEntries(data.completed)) localStorage.setItem('v5-completed', JSON.stringify(data.completed));
                        if (hasEntries(data.mobility)) localStorage.setItem('v5-mobility', JSON.stringify(data.mobility));
                        alert("Imported. Reloading...");
                        window.location.reload();
                      } catch (err) { alert("Import failed: " + err.message); }
                    };
                    reader.readAsText(file);
                    e.target.value = '';
                  }} />
                </label>
              </div>
            </div>

            <div className="h-8"></div>
          </div>
        );
      };

      // CYCLE TAB
      const renderCycleTab = () => {
        const phase = settings.wendlerPhase;
        const pcts = wendlerPcts[phase];

        return (
          <div className="p-4 space-y-4 max-w-md mx-auto">
            {/* Current Phase */}
            <div className="bg-white rounded-xl shadow-sm border border-stone-200 p-5">
              <div className="flex justify-between items-center mb-3">
                <h2 className="font-bold text-stone-800 text-lg">Current Phase</h2>
                <button onClick={() => setShowPhaseSelector(true)} className={`text-sm font-bold px-4 py-2 rounded-lg border-2 ${PHASE_COLORS[phase]}`}>
                  {PHASE_DISPLAY[phase]}
                </button>
              </div>
              <p className="text-xs text-stone-500">Phase auto-advances after each full week (6 sessions). Every 2nd completed cycle rolls into Deload automatically (wks 7/14/21). Do not override — the only deload in 17 weeks was the involuntary one.</p>
              <p className={`text-xs mt-2 font-bold ${(settings.cyclesSinceDeload||0) >= 2 ? 'text-rose-600' : (settings.cyclesSinceDeload||0) === 1 ? 'text-amber-600' : 'text-stone-400'}`}>
                {settings.cyclesSinceDeload || 0} cycle{(settings.cyclesSinceDeload||0) === 1 ? '' : 's'} since last deload{(settings.cyclesSinceDeload||0) >= 2 ? ' — deload now' : (settings.cyclesSinceDeload||0) === 1 ? ' — deload after this cycle' : ''}
              </p>
              
              <div className="flex gap-2 mt-4">
                {WENDLER_PHASES.map((p, i) => (
                  <div key={p} className={`flex-1 text-center py-2 rounded-lg text-[10px] font-bold uppercase tracking-wide ${p === phase ? PHASE_COLORS[p] : 'bg-stone-50 text-stone-300'}`}>
                    {p === '531' ? '5/3/1' : p}
                  </div>
                ))}
              </div>
            </div>

            {/* Wendler Weights */}
            {['bench', 'squat', 'deadlift', 'ohp'].map(lift => {
              const best = recentE1RM(lift);
              const tm = settings.wendlerTM[lift];
              const tmPct = best ? Math.round(tm / best.e * 100) : null;
              const latestBW = bodyweightLogs.length ? bodyweightLogs[bodyweightLogs.length - 1].weight : null;
              return (
              <div key={lift} className="bg-white rounded-xl shadow-sm border border-stone-200 p-4">
                <div className="flex justify-between items-center mb-3">
                  <h3 className="font-bold text-stone-800 capitalize text-lg">{lift}</h3>
                  <span className="text-xs bg-stone-100 px-2 py-1 rounded text-stone-500 font-mono">TM: {tm}</span>
                </div>
                <div className="grid grid-cols-3 gap-3">
                  {pcts.map((s, i) => (
                    <div key={i} className={`text-center p-3 rounded-lg ${i === 2 ? 'bg-stone-800 text-white' : 'bg-stone-50'}`}>
                      <div className={`text-lg font-bold font-mono ${i === 2 ? 'text-white' : 'text-stone-800'}`}>{calcWt(tm, s.p)}</div>
                      <div className={`text-[10px] font-bold mt-1 ${i === 2 ? 'text-stone-300' : 'text-stone-400'}`}>×{s.r}</div>
                      <div className={`text-[9px] mt-0.5 ${i === 2 ? 'text-stone-400' : 'text-stone-300'}`}>{Math.round(s.p * 100)}%</div>
                    </div>
                  ))}
                </div>
                {lift === 'bench' && phase !== 'deload' && (
                  <p className="text-[10px] text-stone-400 mt-2 font-mono">FSL: {calcWt(tm, pcts[0].p)} × 5×5 paused, after the top set</p>
                )}
                {best && (
                  <div className="mt-3 pt-2 border-t border-stone-100 flex justify-between items-center">
                    <span className="text-[10px] text-stone-500 font-mono">e1RM ≈ {Math.round(best.e)} <span className="text-stone-300">({best.w}×{best.r}, W{best.wk})</span>{latestBW ? <span className="text-stone-400"> · {(best.e / latestBW).toFixed(2)}×BW</span> : null}</span>
                    <span className={`text-[10px] font-bold ${tmPct > 92 ? 'text-rose-600' : tmPct > 90 ? 'text-amber-600' : 'text-emerald-600'}`}>TM {tmPct}% {tmPct > 90 ? '— lower TM' : '✓'}</span>
                  </div>
                )}
              </div>
              );
            })}

            {/* Calisthenics overview */}
            <div className="bg-white rounded-xl shadow-sm border border-stone-200 p-4">
              <h3 className="font-bold text-stone-800 mb-3 text-lg">Streetlifting</h3>
              <div className="space-y-3">
                {[{ name: 'Dips', ct: 'dips', day: 1 }, { name: 'Chin Ups', ct: 'chinups', day: 3 }, { name: 'Pull Ups', ct: 'pullups', day: 6 }].map(({ name, ct, day }) => {
                  const topVal = settings.calisthenics[ct]?.top || 0;
                  const pctVal = settings.calisthenics[ct]?.backoffPct || 75;
                  return (
                    <div key={ct} className="flex justify-between items-center py-2 border-b border-stone-50 last:border-0">
                      <div>
                        <span className="text-sm font-medium text-stone-700">{name}</span>
                        <span className="text-[10px] text-stone-400 ml-2">D{day}</span>
                      </div>
                      <div className="text-right">
                        <span className="text-sm font-bold font-mono text-stone-800">{topVal}</span>
                        <span className="text-[10px] text-stone-400 ml-1">top</span>
                        <span className="text-sm font-mono text-stone-500 ml-3">{calcBackoff(topVal, pctVal)}</span>
                        <span className="text-[10px] text-stone-400 ml-1">back</span>
                      </div>
                    </div>
                  );
                })}
              </div>
            </div>
          </div>
        );
      };

      // WORKOUT TAB
      const renderWorkoutTab = () => {
        const dayExIds = settings.schedule[activeDay] || [];
        const phase = settings.wendlerPhase;
        const pcts = wendlerPcts[phase];
        const isCompleted = completedSessions[`${currentWeek}-${activeDay}`];
        const maxWeek = getMaxWeek();

        return (
          <div className="p-4 space-y-5 max-w-md mx-auto">
            {/* Week/Day Select */}
            <div className="bg-white rounded-xl shadow-sm border border-stone-200 overflow-hidden">
              <div className="p-3 border-b border-stone-100 flex justify-between items-center">
                <div className="flex items-center gap-3">
                  <div className="relative">
                    <select value={currentWeek} onChange={e => setCurrentWeek(+e.target.value)} className="appearance-none bg-transparent font-bold text-stone-800 pr-6 outline-none">
                      {Array.from({ length: Math.max(maxWeek + 2, currentWeek + 2) }, (_, i) => i + 1).map(w => <option key={w} value={w}>Week {w}</option>)}
                    </select>
                    <span className="absolute right-0 top-1 text-[10px] text-stone-400">▼</span>
                  </div>
                  <button onClick={() => setShowPhaseSelector(true)} className={`text-[10px] font-bold px-2.5 py-1 rounded-lg border ${PHASE_COLORS[phase]}`}>
                    {PHASE_DISPLAY[phase]}
                  </button>
                </div>
                {isCompleted && <span className="text-[10px] font-bold text-emerald-600 bg-emerald-50 px-2 py-1 rounded-full border border-emerald-100">DONE</span>}
              </div>
              <div className="flex overflow-x-auto no-scrollbar bg-stone-50">
                {[1,2,3,4,5,6].map(d => (
                  <button key={d} onClick={() => setActiveDay(d)}
                    className={`flex-1 py-3 text-xs font-bold whitespace-nowrap px-4 border-r border-stone-100 last:border-0 ${activeDay===d?'bg-white text-stone-900 shadow-sm':'text-stone-400 hover:text-stone-600'}`}>
                    D{d} {completedSessions[`${currentWeek}-${d}`] && <span className="ml-1 text-[8px] text-emerald-500">●</span>}
                  </button>
                ))}
              </div>
            </div>

            <div className="flex justify-between items-end px-1">
              <div>
                <h1 className="text-xl font-bold text-stone-900 leading-none">{dayShort[activeDay]}</h1>
                <p className="text-stone-400 text-xs mt-1 font-medium">{dayNames[activeDay]}</p>
              </div>
            </div>

            {/* Exercises */}
            <div className="space-y-4">
              {dayExIds.map(id => {
                const ex = settings.registry[id];
                if (!ex) return null;
                const log = getLog(currentWeek, activeDay, id);
                const prev = getPrevLog(currentWeek, activeDay, id);

                let tgt = '';
                if (ex.w) {
                  tgt = pcts.map(s => `${calcWt(settings.wendlerTM[ex.wl], s.p)}×${s.r}`).join('  /  ');
                  if (ex.fsl && phase !== 'deload') tgt += `  ·  S4 back-off ${Math.round(calcWt(settings.wendlerTM[ex.wl], pcts[2].p) * 0.85 / 5) * 5}×AMRAP (RIR1-2, paused)`;
                } else if (ex.c) {
                  const topVal = settings.calisthenics[ex.ct]?.top || 0;
                  const pctVal = settings.calisthenics[ex.ct]?.backoffPct || 75;
                  const backVal = calcBackoff(topVal, pctVal);
                  tgt = `Top: ${topVal}  /  Backoff: ${backVal} (${pctVal}%)`;
                }

                return (
                  <div key={id} className={`bg-white rounded-xl shadow-sm border border-stone-200 p-4 transition-opacity ${isCompleted ? 'opacity-75' : ''}`}>
                    <div className="flex justify-between items-start mb-2">
                      <div>
                        <h3 className={`font-bold text-base ${ex.w || ex.c ? 'text-stone-800' : 'text-stone-600'}`}>{ex.n}</h3>
                        {tgt && <p className="text-xs text-emerald-600 font-mono mt-0.5 font-medium">{tgt}</p>}
                      </div>
                      <div className="text-right">
                        <span className="text-xs font-bold text-stone-400 bg-stone-100 px-1.5 py-0.5 rounded">{ex.s} × {ex.r}</span>
                        <p className="text-[10px] text-stone-400 mt-1">{ex.nt}</p>
                      </div>
                    </div>

                    <div className="flex flex-wrap gap-2">
                      {Array.from({ length: ex.s }, (_, i) => (
                        <ExerciseInput key={`${id}-${i}`} initialValue={log.sets?.[i] || ''} lastValue={prev.sets?.[i] || ''} placeholder={prev.sets?.[i] || "---"} setIndex={i} onSave={(v) => logSet(currentWeek, activeDay, id, i, v)} />
                      ))}
                    </div>
                    <NotesInput key={`${id}-notes`} initialValue={log.notes || ''} lastValue={prev.notes || ''} placeholder="Notes..." onSave={(v) => logNotes(currentWeek, activeDay, id, v)} />

                    {(prev.sets?.some(isFilled) || isFilled(prev.notes)) && (
                      <div className="mt-3 p-2.5 rounded-lg bg-stone-50 border border-stone-100 text-xs text-stone-500">
                        <span className="font-bold text-stone-400 uppercase text-[9px] tracking-wide mr-2">
                          {prev._week ? `W${prev._week} D${prev._day}` : 'Last'}
                        </span>
                        {prev.sets?.filter(isFilled).join(' / ')}
                        {prev.notes && <div className="mt-1 italic text-stone-400 border-t border-stone-100 pt-1">{prev.notes}</div>}
                      </div>
                    )}
                  </div>
                );
              })}
            </div>

            {/* Session Metadata */}
            <div className="bg-white rounded-xl shadow-sm border border-stone-200 p-4">
              <div className="flex gap-3">
                <div className="flex-1">
                  <label className="text-[10px] font-bold text-stone-400 uppercase tracking-wide mb-1 block">Date</label>
                  <input type="date" value={getSessionMeta(currentWeek, activeDay).date || new Date().toISOString().split('T')[0]}
                    onChange={e => saveSessionMeta(currentWeek, activeDay, 'date', e.target.value)}
                    className="w-full px-3 py-2 border border-stone-200 rounded-lg bg-stone-50 text-sm text-stone-700" />
                </div>
                <div className="w-28">
                  <label className="text-[10px] font-bold text-stone-400 uppercase tracking-wide mb-1 block">Duration</label>
                  <div className="relative">
                    <input type="number" value={getSessionMeta(currentWeek, activeDay).duration || ''}
                      onChange={e => saveSessionMeta(currentWeek, activeDay, 'duration', e.target.value)}
                      placeholder="—" className="w-full px-3 py-2 pr-10 border border-stone-200 rounded-lg bg-stone-50 text-sm text-stone-700 font-mono" />
                    <span className="absolute right-3 top-1/2 -translate-y-1/2 text-stone-400 text-xs">min</span>
                  </div>
                </div>
              </div>
            </div>

            <button onClick={handleFinishDay}
              className={`w-full py-4 rounded-xl font-bold text-base shadow-lg transition-transform active:scale-[0.98] flex justify-center items-center gap-2 ${isCompleted ? 'bg-stone-800 text-stone-400' : 'bg-stone-900 text-white'}`}>
              <span>{isCompleted ? "Update Session" : "Complete Workout"}</span><span className="text-xl">→</span>
            </button>
            <div className="h-8"></div>
          </div>
        );
      };

      // HISTORY TAB
      const renderHistoryTab = () => {
        const maxWeek = getMaxWeek();
        return (
          <div className="p-4 max-w-md mx-auto">
            <h2 className="font-bold text-stone-800 mb-6 text-2xl">Logbook</h2>
            {Array.from({ length: maxWeek }, (_, i) => maxWeek - i).map(wk => {
              const hasData = [1,2,3,4,5,6].some(d => workoutLogs[`${wk}-${d}`] && Object.keys(workoutLogs[`${wk}-${d}`]).filter(k => k !== '_meta' && k !== '_ts').length > 0);
              if (!hasData) return null;
              return (
                <div key={wk} className="mb-6 bg-white rounded-xl shadow-sm border border-stone-200 overflow-hidden">
                  <div className="bg-stone-50 px-4 py-3 flex justify-between items-center border-b border-stone-100">
                    <h3 className="font-bold text-stone-700">Week {wk}</h3>
                    <button onClick={() => deleteWeekEntry(wk)} className="text-stone-400 hover:text-rose-500 transition-colors">🗑️</button>
                  </div>
                  <div className="p-4 space-y-4">
                    {[1,2,3,4,5,6].map(d => {
                      const data = workoutLogs[`${wk}-${d}`]; if (!data) return null;
                      const entries = Object.entries(data).filter(([key]) => key !== '_meta' && key !== '_ts');
                      if (entries.length === 0) return null;
                      const meta = data._meta || {};
                      const dateStr = meta.date ? new Date(meta.date + 'T00:00:00').toLocaleDateString('en-US', { month: 'short', day: 'numeric' }) : '';
                      const durationStr = meta.duration ? `${meta.duration}m` : '';
                      return (
                        <div key={d} className="border-l-2 border-stone-200 pl-3">
                          <div className="flex items-center gap-2 mb-1">
                            <button onClick={() => jumpToSession(wk, d)} className="text-xs font-bold text-stone-600 uppercase tracking-wide hover:text-stone-900 hover:underline transition-colors">
                              Day {d} — {dayShort[d]}
                            </button>
                            {dateStr && <span className="text-[10px] text-stone-400">{dateStr}</span>}
                            {durationStr && <span className="text-[10px] text-stone-400 bg-stone-100 px-1.5 py-0.5 rounded">{durationStr}</span>}
                            {completedSessions[`${wk}-${d}`] && <span className="text-[8px] bg-emerald-100 text-emerald-700 px-1 rounded font-bold">✔</span>}
                            <button onClick={() => deleteDayEntry(wk, d)} className="text-[10px] text-stone-300 hover:text-rose-500 px-1 ml-auto">✕</button>
                          </div>
                          <div className="space-y-1">
                            {entries.map(([id, v]) => {
                              const sets = v.sets?.filter(isFilled) || [];
                              if (!sets.length && !v.notes) return null;
                              const exName = v.n || settings.registry[id]?.n || id;
                              return (
                                <div key={id} className="text-sm">
                                  <span className="text-stone-800 font-medium">{exName}: </span>
                                  <span className="font-mono text-stone-600">{sets.join(' / ')}</span>
                                  {v.notes && <span className="text-stone-400 text-xs italic ml-2">— {v.notes}</span>}
                                </div>
                              );
                            })}
                          </div>
                        </div>
                      );
                    })}
                  </div>
                </div>
              );
            })}
            {maxWeek <= 1 && !Object.keys(workoutLogs).some(k => k !== '_updated') && (
              <p className="text-center text-stone-400 text-sm py-8">No sessions logged yet. Go lift!</p>
